services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookme
      POSTGRES_PASSWORD: bookme
      POSTGRES_DB: bookme
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookme -d bookme"]
      interval: 5s
      timeout: 5s
      retries: 10
